[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-agent"
version = "0.1.0"
description = "Resume PDFs and generates quizzes"
requires-python = ">=3.11"
readme = "README.MD"


dependencies = [
    "pypdf>=4.2",
    "ollama>=0.40.18",
    "python-dotenv>=1.0",
    "typer>0.12",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]


[project.scripts]
pdf-study-agent = "academic_agent.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
